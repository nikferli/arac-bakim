name: Supabase Ping

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Her Pazartesi ve Perşembe saat 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -s "https://nvnvmnumcxckrxaxnqgg.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_9SjeGz7rJpcSWddSVQZodg_HIC68cWA" \
            -o /dev/null -w "HTTP %{http_code}"

      - name: Keep repo active (60 gün sınırını önler)
        run: |
          echo "Son ping: $(date -u '+%Y-%m-%d %H:%M UTC')" > last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keep repo active [skip ci]"
          git push
